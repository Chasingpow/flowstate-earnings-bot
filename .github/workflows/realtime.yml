name: Flowstate realtime worker

# Always-on earnings worker running on GitHub Actions (no VM).
# A single job runs the worker for ~5h25m, then exits cleanly. Concurrency keeps
# exactly one follow-up run queued, so it starts the instant this one ends —
# continuous coverage. De-dupe state is committed back to the repo so restarts
# never repost. Free because the repo is public (public repos get unlimited
# Actions minutes).

on:
  workflow_dispatch:
  schedule:
    # Keep a run queued to take over at handoff / after a crash.
    - cron: "*/15 * * * *"

concurrency:
  group: realtime-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup fonts
        run: |
          npm i @fontsource/inter @fontsource/space-grotesk
          mkdir -p fonts
          cp node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2 fonts/inter-400.woff2
          cp node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2 fonts/inter-500.woff2
          cp node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2 fonts/inter-600.woff2
          cp node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2 fonts/inter-700.woff2
          cp node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2 fonts/inter-800.woff2
          cp node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2 fonts/grotesk-500.woff2
          cp node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2 fonts/grotesk-700.woff2

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Unpack worker
        run: |
          base64 -d worker.py.gz.b64 | gunzip > worker.py
          python -c "import ast; ast.parse(open('worker.py').read()); print('worker.py OK')"

      - name: Git identity
        run: |
          git config user.name "flowstate-bot"
          git config user.email "flowstate-bot@users.noreply.github.com"

      - name: Run worker
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIN_MARKET_CAP: "2000000000"
          GIT_AUTO_COMMIT: "1"
          MAX_RUNTIME_SEC: "19500"
          STATE_COMMIT_SEC: "120"
          EDGAR_POLL_SEC: "20"
          ACTUALS_POLL_SEC: "45"
          PARSE_PRELIM: "0"
          SEC_USER_AGENT: "FlowstateAlpha earnings-bot (contact: keithharasymiw@gmail.com)"
        run: python worker.py
